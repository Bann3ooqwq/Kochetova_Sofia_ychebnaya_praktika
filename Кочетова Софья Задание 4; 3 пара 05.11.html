<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Заголовок страницы</title>
  </head>
  <body>
    <button id="regular">Обычная функция</button>
    <button id="arrow">Стрелочная функция</button>
  
    <div id="output"></div>
    <script>
            const regularBtn = document.getElementById('regular');
      const arrowBtn = document.getElementById('arrow');
      const output = document.getElementById('output');
      regularBtn.addEventListener(
        'click',
        function(event) {
          output.textContent = '';
          output.textContent += `${this.id}`, 
          console.log(this === event.currentTarget);
        }
      );
      arrowBtn.addEventListener(
        'click',
        (event) => {
          output.textContent = '';
          output.textContent += `${event.currentTarget.id}`,
          console.log(this);
        }
      );
    </script>
  </body>
</html>
