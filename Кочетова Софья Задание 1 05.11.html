<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Заголовок страницы</title>
</head>

<body>
    <h1 id="title">Заголовок</h1>
    <p id="text">Текст</p>
    <button id="button">Нажми меня</button>
    <script>
        let title = document.querySelector('#title');
        let text = document.querySelector('#text');
        let button = document.querySelector('#button');
        document.addEventListener('click', function () { title.textContent = "Добро пожаловать!" })
        document.addEventListener('click', function () { text.textContent = "Мы изучаем JavaScript и DOM" })
    </script>
</body>

</html>
